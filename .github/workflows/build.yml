name: Build and verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build installer
        shell: pwsh
        run: ./build.ps1
      - name: Test Rust code and dashboard
        shell: pwsh
        run: |
          cargo test --bin pk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke-dashboard.py target/release/pk.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage npm executable
        shell: pwsh
        run: |
          Copy-Item target/release/pk.exe target/release/npm-pk-windows-x64.exe
          New-Item -ItemType Directory -Force npm/binaries/win32-x64 | Out-Null
          Copy-Item target/release/pk.exe npm/binaries/win32-x64/pk.exe
          node npm/bin/pk.cjs status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: pk-windows-x64
          path: |
            target/release/pk-installer.exe
            target/release/npm-pk-windows-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build packages
        run: bash build-linux.sh
      - name: Verify packages and dashboard
        run: |
          bash verify-linux.sh
          cargo test --bin pk
          python3 scripts/smoke-dashboard.py "$HOME/.cache/pk-rs/cargo-target/x86_64-unknown-linux-musl/release/pk"
          python3 scripts/smoke-stop-ssh.py "$HOME/.cache/pk-rs/cargo-target/x86_64-unknown-linux-musl/release/pk"
      - name: Stage npm executable
        run: |
          install -m 755 "$HOME/.cache/pk-rs/cargo-target/x86_64-unknown-linux-musl/release/pk" target/linux-dist/npm-pk-linux-x64
          mkdir -p npm/binaries/linux-x64
          install -m 755 target/linux-dist/npm-pk-linux-x64 npm/binaries/linux-x64/pk
          node npm/bin/pk.cjs status
      - uses: actions/upload-artifact@v7
        with:
          name: pk-linux-x64
          path: target/linux-dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build universal installer
        run: bash build-macos.sh
      - name: Test macOS package, dashboard, and removal
        run: |
          cargo test --bin pk
          pkg=$(find target/macos-dist -maxdepth 1 -name '*.pkg' -print -quit)
          test -n "$pkg"
          sudo installer -pkg "$pkg" -target /
          test -x '/Applications/PK Proxy Manager.app/Contents/MacOS/pk'
          python3 scripts/smoke-dashboard.py /usr/local/bin/pk
          python3 scripts/smoke-stop-ssh.py /usr/local/bin/pk
          bash '/Applications/Uninstall PK Proxy Manager.command'
          test ! -e /usr/local/bin/pk
          test ! -e '/Applications/PK Proxy Manager.app'
      - name: Test npm executable
        run: |
          mkdir -p npm/binaries/darwin-universal
          install -m 755 target/macos-dist/npm-pk-macos-universal npm/binaries/darwin-universal/pk
          node npm/bin/pk.cjs status
      - uses: actions/upload-artifact@v7
        with:
          name: pk-macos-universal
          path: |
            target/macos-dist/*.pkg
            target/macos-dist/npm-pk-macos-universal
          if-no-files-found: error

  npm-package:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: pk-*
          path: npm-assets
          merge-multiple: true
      - name: Assemble and verify npm package
        run: |
          mkdir -p npm/binaries/win32-x64 npm/binaries/linux-x64 npm/binaries/darwin-universal
          cp npm-assets/npm-pk-windows-x64.exe npm/binaries/win32-x64/pk.exe
          cp npm-assets/npm-pk-linux-x64 npm/binaries/linux-x64/pk
          cp npm-assets/npm-pk-macos-universal npm/binaries/darwin-universal/pk
          chmod 755 npm/binaries/linux-x64/pk npm/binaries/darwin-universal/pk
          npm --prefix npm test
          node npm/scripts/verify-binaries.cjs
          npm pack ./npm --dry-run --ignore-scripts --json > npm-pack.json
          python3 - <<'PY'
          import json
          names = {file['path'] for file in json.load(open('npm-pack.json'))[0]['files']}
          required = {
              'binaries/win32-x64/pk.exe',
              'binaries/linux-x64/pk',
              'binaries/darwin-universal/pk',
          }
          if not required <= names:
              raise SystemExit(f'Native binaries missing from npm tarball: {required - names}')
          package = json.load(open('npm-pack.json'))[0]
          executable = {'bin/pk.cjs', 'binaries/linux-x64/pk', 'binaries/darwin-universal/pk'}
          files = {file['path']: file for file in package['files']}
          for name in executable:
              if not files[name]['mode'] & 0o111:
                  raise SystemExit(f'Executable bit missing from npm tarball: {name}')
          PY
          mkdir -p npm-dist
          npm pack ./npm --ignore-scripts --pack-destination npm-dist
      - uses: actions/upload-artifact@v7
        with:
          name: pk-npm-package
          path: |
            npm-assets/npm-pk-windows-x64.exe
            npm-assets/npm-pk-linux-x64
            npm-assets/npm-pk-macos-universal
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: pk-npm-tarball
          path: npm-dist/*.tgz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, npm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib

          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          with open('web/package.json', encoding='utf-8') as source:
              web_version = json.load(source)['version']
          with open('web/package-lock.json', encoding='utf-8') as source:
              lock_version = json.load(source)['version']
          with open('npm/package.json', encoding='utf-8') as source:
              npm_version = json.load(source)['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}' or web_version != version or lock_version != version or npm_version != version:
              raise SystemExit(
                  f'Version mismatch: tag={tag}, Cargo={version}, '
                  f'web={web_version}, lock={lock_version}, npm={npm_version}'
              )
          PY
      - uses: actions/download-artifact@v8
        with:
          pattern: pk-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f release-assets/pk-installer.exe
          test -n "$(find release-assets -maxdepth 1 -name '*.pkg' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)"
          mv release-assets/pk-installer.exe "release-assets/pk-proxy-manager_${RELEASE_TAG#v}_windows-x64-setup.exe"
          (cd release-assets && sha256sum ./* > SHA256SUMS)
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --generate-notes \
            --notes 'npm 설치: npm install -g @gomul82/pk. 실행: pk ui. 기존 pk-proxy-manager 사용자는 pk stop 후 npm uninstall -g pk-proxy-manager를 실행하고 새 패키지를 설치하세요. OS별 설치 파일도 제공합니다. 개인 설정은 유지됩니다. macOS 패키지는 아직 서명·공증되지 않았습니다.'

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_TRUSTED_PUBLISHER_ENABLED == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: pk-npm-tarball
          path: npm-dist
      - name: Publish npm package through trusted publishing
        run: |
          npm publish npm-dist/gomul82-pk-*.tgz --access public
