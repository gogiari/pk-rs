name: Build and publish npm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build npm executable
        shell: pwsh
        run: ./build.ps1
      - name: Test Rust code and dashboard
        shell: pwsh
        run: |
          cargo test --bin pk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke-dashboard.py target/release/pk.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke-browsers.py target/release/pk.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage npm executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/npm-assets | Out-Null
          Copy-Item target/release/pk.exe target/npm-assets/npm-pk-windows-x64.exe
          New-Item -ItemType Directory -Force npm/binaries/win32-x64 | Out-Null
          Copy-Item target/release/pk.exe npm/binaries/win32-x64/pk.exe
          node npm/bin/pk.cjs status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: pk-windows-x64
          path: target/npm-assets/npm-pk-windows-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build npm executable
        run: bash build-linux.sh
      - name: Test Rust code and dashboard
        run: |
          cargo test --bin pk
          python3 scripts/smoke-dashboard.py npm/binaries/linux-x64/pk
          python3 scripts/smoke-browsers.py npm/binaries/linux-x64/pk
          python3 scripts/smoke-stop-ssh.py npm/binaries/linux-x64/pk
      - name: Test npm executable
        run: |
          node npm/bin/pk.cjs status
      - uses: actions/upload-artifact@v7
        with:
          name: pk-linux-x64
          path: target/npm-assets/npm-pk-linux-x64
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build universal npm executable
        run: bash build-macos.sh
      - name: Test Rust code and dashboard
        run: |
          cargo test --bin pk
          python3 scripts/smoke-dashboard.py npm/binaries/darwin-universal/pk
          python3 scripts/smoke-browsers.py npm/binaries/darwin-universal/pk
          python3 scripts/smoke-stop-ssh.py npm/binaries/darwin-universal/pk
      - name: Test npm executable
        run: |
          node npm/bin/pk.cjs status
      - uses: actions/upload-artifact@v7
        with:
          name: pk-macos-universal
          path: target/npm-assets/npm-pk-macos-universal
          if-no-files-found: error

  npm-package:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib

          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          with open('web/package.json', encoding='utf-8') as source:
              web_version = json.load(source)['version']
          with open('web/package-lock.json', encoding='utf-8') as source:
              lock_version = json.load(source)['version']
          with open('npm/package.json', encoding='utf-8') as source:
              npm_version = json.load(source)['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}' or web_version != version or lock_version != version or npm_version != version:
              raise SystemExit(
                  f'Version mismatch: tag={tag}, Cargo={version}, '
                  f'web={web_version}, lock={lock_version}, npm={npm_version}'
              )
          PY
      - uses: actions/download-artifact@v8
        with:
          pattern: pk-*
          path: npm-assets
          merge-multiple: true
      - name: Assemble and verify npm package
        run: |
          mkdir -p npm/binaries/win32-x64 npm/binaries/linux-x64 npm/binaries/darwin-universal
          cp npm-assets/npm-pk-windows-x64.exe npm/binaries/win32-x64/pk.exe
          cp npm-assets/npm-pk-linux-x64 npm/binaries/linux-x64/pk
          cp npm-assets/npm-pk-macos-universal npm/binaries/darwin-universal/pk
          chmod 755 npm/binaries/linux-x64/pk npm/binaries/darwin-universal/pk
          npm --prefix npm test
          node npm/scripts/verify-binaries.cjs
          npm pack ./npm --dry-run --ignore-scripts --json > npm-pack.json
          python3 - <<'PY'
          import json
          names = {file['path'] for file in json.load(open('npm-pack.json'))[0]['files']}
          required = {
              'binaries/win32-x64/pk.exe',
              'binaries/linux-x64/pk',
              'binaries/darwin-universal/pk',
          }
          if not required <= names:
              raise SystemExit(f'Native binaries missing from npm tarball: {required - names}')
          package = json.load(open('npm-pack.json'))[0]
          executable = {'bin/pk.cjs', 'binaries/linux-x64/pk', 'binaries/darwin-universal/pk'}
          files = {file['path']: file for file in package['files']}
          for name in executable:
              if not files[name]['mode'] & 0o111:
                  raise SystemExit(f'Executable bit missing from npm tarball: {name}')
          PY
          mkdir -p npm-dist
          npm pack ./npm --ignore-scripts --pack-destination npm-dist
      - uses: actions/upload-artifact@v7
        with:
          name: pk-npm-tarball
          path: npm-dist/*.tgz
          if-no-files-found: error

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_TRUSTED_PUBLISHER_ENABLED == 'true'
    needs: npm-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: pk-npm-tarball
          path: npm-dist
      - name: Publish npm package through trusted publishing
        run: |
          npm publish ./npm-dist/gomul82-pk-*.tgz --access public
