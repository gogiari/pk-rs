[package]
name = "pk"
version = "0.1.3"
edition = "2021"
default-run = "pk"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
axum = "0.7"
rust-embed = "8"

[profile.release]
opt-level = 3
lto = true
strip = true
